      <!-- remove phone or linkedin if you dont want them -->
    </section>

    <section>
      <h2> Send a Message </h2>

      <!-- using formsubmit.co to send the messages to my email -->
      <!-- the first time you send it, formsubmit will email you a link to activate it -->
      <form action="https://formsubmit.co/[YOUR_EMAIL]" method="POST">

        <label for="name">Name:</label>
        <input type="text" name="name" id="name" required>

        <label for="email">Email:</label>
        <input type="email" name="email" id="email" required>

        <label for="message">Message:</label>
        <textarea name="message" id="message" rows="5" required></textarea>

        <!-- hidden settings for formsubmit -->
        <input type="hidden" name="_subject" value="New message from my portfolio">
        <input type="hidden" name="_captcha" value="false">

        <input type="submit" value="Send" class="btn">

      </form>
    </section>
